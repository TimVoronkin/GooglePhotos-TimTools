<!DOCTYPE html>
<html>

<head>
    <title>Settings - Tim Tools for Google Photos</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1><img src="../../assets/active/logo-128.png" alt="Icon" style="width: 32px; height: 32px;"> Google Photos Tim
            Tools - Settings</h1>

        <div class="section">
            <div class="section-header">
                <h2>Up Button</h2>
                <div class="option-row">
                    <label class="toggle-switch">
                        <input type="checkbox" id="enableUpButton">
                        <span class="slider"></span>
                        <span class="label-text">Enable</span>
                    </label>
                    <img src="../../assets/active/up-button.svg" class="option-icon" title="Up Button Icon">
                </div>
            </div>

            <div class="sub-section" id="up-button-sub-section">
                <h3>Up Button Configuration</h3>
                <div class="option-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="upButtonClosePhoto">
                        Auto-close photo and return to timeline grid
                    </label>
                </div>
            </div>

            <div class="section-header">
                <h2>Date Search</h2>
                <div class="option-row">
                    <label class="toggle-switch">
                        <input type="checkbox" id="enableDateSearch">
                        <span class="slider"></span>
                        <span class="label-text">Enable</span>
                    </label>
                    <img src="../../assets/active/calendar-icon.svg" class="option-icon" title="Calendar Icon">
                </div>
            </div>

            <div class="section-header">
                <h2>Delete Shortcut</h2>
                <div class="option-row">
                    <label class="toggle-switch">
                        <input type="checkbox" id="enableDeleteShortcut">
                        <span class="slider"></span>
                        <span class="label-text">Enable</span>
                    </label>
                    <svg class="option-icon" viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: #e8eaed; opacity: 0.8;">
                        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                    </svg>
                </div>
            </div>

            <div class="section-header">
                <h2>KML Export</h2>
                <div class="option-row">
                    <label class="toggle-switch">
                        <input type="checkbox" id="enableKmlExport">
                        <span class="slider"></span>
                        <span class="label-text">Enable</span>
                    </label>
                    <img src="../../assets/active/kml-export-icon.svg" class="option-icon" title="KML Icon">
                </div>
            </div>

            <div class="sub-section" id="kml-section">
                <h3>Export Configuration</h3>

                <div class="option-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="kmlCreateSubfolder">
                        Create subfolder
                    </label>
                </div>

                <!-- Unified Path Preview and Input -->
                <div class="path-config-container">
                    <span class="path-segment">\Downloads\</span>

                    <div class="input-wrapper" id="folderInputWrapper">
                        <input type="text" id="kmlFolderName" placeholder="Folder" class="inline-input">
                        <span class="path-separator">\</span>
                    </div>

                    <input type="text" id="kmlFilePrefix" placeholder="Prefix_" class="inline-input">
                    <span class="path-segment">YYYY-MM-DD.kml</span>
                </div>
            </div>
        </div>

    </div>
    <script src="../core/settings.js"></script>
    <script src="options.js"></script>
</body>

</html>
